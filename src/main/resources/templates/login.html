<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QSpark - Login</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css?v=2">
    <style>
        *{ margin:0; padding:0; box-sizing:border-box; }
        body{
            font-family: 'Inter', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #EAEAEA;
            padding: 24px;
            -webkit-font-smoothing: antialiased;
        }

        .login-container{
            width: 100%;
            max-width: 920px;
            margin: 0 auto;
        }

        .login-card{
            display: flex;
            background: #FFFFFF;
            border-radius: 32px;
            overflow: hidden;
            box-shadow: 0 24px 80px rgba(0,0,0,0.08), 0 8px 32px rgba(0,0,0,0.04);
            min-height: 500px;
        }

        .login-left{
            width: 48%;
            padding: 48px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .login-left-inner{
            width: 100%;
            max-width: 360px;
            margin: 0 auto;
        }

        .login-logo{
            display: block;
            margin: 0 auto 28px;
            width: 100px;
            height: auto;
            border-radius: 14px;
        }

        .login-left-inner h1{
            font-size: 30px;
            font-weight: 800;
            color: #111827;
            letter-spacing: -0.025em;
            text-align: center;
            margin-bottom: 6px;
        }

        .login-subtitle{
            font-size: 15px;
            color: #6B7280;
            text-align: center;
            margin-bottom: 32px;
            line-height: 1.5;
        }

        .form-group{
            margin-bottom: 18px;
        }

        .input-wrap{
            position: relative;
        }
        .input-wrap .icon{
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            color: #9CA3AF;
            pointer-events: none;
            transition: color 0.2s;
        }
        .input-wrap:focus-within .icon{
            color: #2563EB;
        }
        .input-wrap input{
            width: 100%;
            padding: 15px 18px 15px 48px;
            background: #F1F5F9;
            border: 1.5px solid transparent;
            border-radius: 999px;
            font-size: 15px;
            font-family: 'Inter', system-ui, sans-serif;
            color: #111827;
            outline: none;
            transition: all 0.25s;
        }
        .input-wrap input::placeholder{
            color: #9CA3AF;
            font-weight: 400;
        }
        .input-wrap input:focus{
            border-color: #2563EB;
            background: #FFFFFF;
            box-shadow: 0 0 0 4px rgba(37,99,235,0.08);
        }

        .login-btn{
            width: 100%;
            padding: 16px 24px;
            border: none;
            border-radius: 999px;
            background: #2563EB;
            color: #FFFFFF;
            font-size: 16px;
            font-weight: 700;
            font-family: 'Inter', system-ui, sans-serif;
            cursor: pointer;
            transition: all 0.25s;
            letter-spacing: 0.01em;
            margin-top: 8px;
        }
        .login-btn:hover{
            background: #1D4ED8;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(37,99,235,0.25);
        }
        .login-btn:active{
            transform: translateY(0);
        }

        .error-msg{
            text-align: center;
            font-size: 14px;
            font-weight: 500;
            color: #DC2626;
            margin-top: 16px;
            min-height: 22px;
        }

        .back-link{
            display: block;
            text-align: center;
            margin-top: 16px;
            font-size: 14px;
            font-weight: 600;
            color: #6B7280;
            text-decoration: none;
            transition: color 0.2s;
            font-family: 'Inter', system-ui, sans-serif;
        }
        .back-link:hover{
            color: #2563EB;
        }

        .login-right{
            width: 52%;
            position: relative;
            overflow: hidden;
            background: #111827;
        }
        .login-right img{
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .card-shake{
            animation: shake 0.4s ease;
        }
        @keyframes shake{
            0%, 100%{ transform: translateX(0); }
            25%{ transform: translateX(-6px); }
            75%{ transform: translateX(6px); }
        }

        @media(max-width: 1024px){
            .login-left{
                padding: 40px 32px;
            }
        }

        @media(max-width: 768px){
            body{ padding: 0; }
            .login-card{
                flex-direction: column;
                border-radius: 0;
                min-height: auto;
                box-shadow: none;
            }
            .login-left{
                width: 100%;
                padding: 40px 24px;
                order: 1;
            }
            .login-left-inner{
                max-width: 400px;
            }
            .login-right{
                width: 100%;
                height: 240px;
                order: 0;
            }
            .login-card{
                border-radius: 24px;
                margin: 12px;
                box-shadow: 0 24px 80px rgba(0,0,0,0.08), 0 8px 32px rgba(0,0,0,0.04);
            }
            .login-left-inner h1{
                font-size: 26px;
            }
        }

        @media(max-width: 480px){
            .login-left{
                padding: 32px 20px;
            }
            .login-logo{
                width: 80px;
            }
            .login-right{
                height: 180px;
            }
        }

    </style>
</head>
<body>

    <div class="login-container">
        <div class="login-card">
            <div class="login-left">
                <div class="login-left-inner">
                    <img src="/logo-light.webp" alt="QSpark" class="login-logo">

                    <h1>Welcome Back</h1>
                    <p class="login-subtitle">Sign in to manage your smart parking system.</p>

                    <form action="/login" method="post" id="loginForm">
                        <input type="hidden" name="_csrf" th:value="${_csrf.token}">

                        <div class="form-group">
                            <div class="input-wrap">
                                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                                <input type="text" id="username" name="username" placeholder="Username" required autocomplete="username">
                            </div>
                        </div>

                        <div class="form-group">
                            <div class="input-wrap">
                                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                                <input type="password" id="password" name="password" placeholder="Password" required autocomplete="current-password">
                            </div>
                        </div>

                        <button type="submit" class="login-btn">Sign In</button>

                        <p class="error-msg" th:if="${param.error != null}">Invalid Username or Password</p>
                    </form>

                    <a href="/" class="back-link">Back to Home</a>
                </div>
            </div>
            <div class="login-right">
                <img src="https://images.unsplash.com/photo-1503376780353-7e6692767b70?w=800&q=80" alt="Premium car" loading="lazy">
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        var params = new URLSearchParams(window.location.search);
        if (params.get('error') === 'true') {
            var card = document.querySelector('.login-left-inner');
            card.classList.add('card-shake');
            setTimeout(function(){ card.classList.remove('card-shake'); }, 400);
        }
    </script>

</body>
</html>
