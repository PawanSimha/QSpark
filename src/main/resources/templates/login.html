<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Q-Park - Login</title>
    <link rel="icon" type="image/png" href="/logo.png">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Inter', system-ui, -apple-system, sans-serif;
        }

        body{
            background-color:#F8FAFC;
            color:#0F172A;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            -webkit-font-smoothing: antialiased;
        }

        .container{
            width:1000px;
            height:600px;
            background:#FFFFFF;
            border-radius:16px;
            overflow:hidden;
            display:flex;
            border: 1px solid #E2E8F0;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        .left{
            width:50%;
            padding:60px;
            display:flex;
            flex-direction:column;
            justify-content:center;
        }

        .logo{
            display:flex;
            align-items:center;
            gap:8px;
            font-size:24px;
            font-weight:800;
            color:#0F172A;
            margin-bottom:48px;
            letter-spacing:-0.025em;
        }

        .logo span{
            color:#2563EB;
        }

        .title{
            font-size:32px;
            font-weight:700;
            color:#0F172A;
            line-height:1.2;
            margin-bottom:8px;
            letter-spacing:-0.025em;
        }

        .subtitle{
            color:#64748B;
            font-size:15px;
            margin-bottom:32px;
            font-weight:400;
        }

        label{
            display:block;
            margin-bottom:6px;
            color:#334155;
            font-size:14px;
            font-weight:500;
        }

        input[type="text"],
        input[type="password"]{
            width:100%;
            padding:12px 16px;
            border:1px solid #CBD5E1;
            background-color:#F8FAFC;
            color:#0F172A;
            border-radius:8px;
            margin-bottom:20px;
            font-size:14px;
            transition:all 0.2s;
        }

        input[type="text"]:focus,
        input[type="password"]:focus{
            outline:none;
            border-color:#3B82F6;
            background-color:#FFFFFF;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .options{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:32px;
            font-size:14px;
            color:#475569;
            font-weight:500;
        }

        .options label{
            display:flex;
            align-items:center;
            gap:8px;
            margin-bottom:0;
            cursor:pointer;
        }

        .options input[type="checkbox"]{
            width:16px;
            height:16px;
            accent-color:#2563EB;
            cursor:pointer;
        }

        .options a{
            color:#2563EB;
            text-decoration:none;
            transition:color 0.2s;
        }

        .options a:hover{
            color:#1D4ED8;
            text-decoration:underline;
        }

        .login-btn{
            width:100%;
            padding:12px 24px;
            border:none;
            border-radius:8px;
            background:#2563EB;
            color:white;
            font-size:15px;
            font-weight:600;
            cursor:pointer;
            transition:background 0.2s;
        }

        .login-btn:hover{
            background:#1D4ED8;
        }

        .error{
            color:#EF4444;
            margin-top:16px;
            font-size:14px;
            font-weight:500;
            text-align:center;
        }

        .right{
            width:50%;
            position:relative;
        }

        .right img{
            width:100%;
            height:100%;
            object-fit:cover;
        }

        .right::after{
            content:'';
            position:absolute;
            inset:0;
            background: linear-gradient(135deg, rgba(37,99,235,0.1) 0%, rgba(15,23,42,0.7) 100%);
            mix-blend-mode: multiply;
            pointer-events:none;
        }
    </style>

</head>
<body>

<div class="container">

    <div class="left">

        <div class="logo" style="gap:12px;">
            <img src="/logo.png" alt="Q-Park" style="width:38px;height:38px;border-radius:8px;object-fit:cover;">
            <div>
                <div style="font-size:20px;font-weight:800;line-height:1.2;"><span>Q</span>-Park</div>
                <div style="font-size:10px;color:#94A3B8;font-weight:500;">Quick &amp; Smart Parking</div>
            </div>
        </div>

        <div class="title">
            Welcome back
        </div>
        <div class="subtitle">
            Enter your credentials to access your account.
        </div>

        <form action="/login" method="post">

            <label>Username</label>
            <input type="text"
                   name="username"
                   placeholder="Enter Username"
                   required>

            <label>Password</label>
            <input type="password"
                   name="password"
                   placeholder="Enter Password"
                   required>

            <div class="options">
                <label>
                    <input type="checkbox">
                    Remember Me
                </label>

                <a href="#">Forgot Password?</a>
            </div>

            <button type="submit" class="login-btn">
                Login
            </button>

            <p class="error" th:text="${error}"></p>

            <div style="text-align:center; margin-top: 16px;">
                <a href="/" style="color:#64748B; font-size:14px; text-decoration:none; font-weight:500; transition:color 0.2s;">
                    &larr; Back to Home
                </a>
            </div>

        </form>

    </div>

    <div class="right">
        <img src="https://images.unsplash.com/photo-1503376780353-7e6692767b70?w=1200"
             alt="Car">
    </div>

</div>

</body>
</html>
