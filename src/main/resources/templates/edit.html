<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QSpark - Edit Booking</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css?v=2">
  <style>
    .edit-card {
      max-width: 640px;
      margin: 0 auto;
    }
    .form-grid-edit {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .full-width { grid-column: 1 / -1; }
    @media (max-width: 600px) {
      .form-grid-edit { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div id="toastContainer" class="toast-container"></div>

<div class="app-layout">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <img src="/logo-light.webp" alt="QSpark" class="sidebar-logo-img" data-theme-img data-theme-light="/logo-light.webp" data-theme-dark="/logo-dark.webp">
    </div>
    <nav class="sidebar-nav">
      <a href="/dashboard" class="sidebar-link">
        <span class="sidebar-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><path d="M9 17V7h4a3 3 0 1 1 0 6H9"/></svg>
        </span>
        <span class="sidebar-label">Dashboard</span>
      </a>
      <a href="/dashboard?tab=occupied" class="sidebar-link">
        <span class="sidebar-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><path d="M3 9h18"/></svg>
        </span>
        <span class="sidebar-label">Active</span>
      </a>
      <a href="/dashboard?tab=history" class="sidebar-link">
        <span class="sidebar-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        </span>
        <span class="sidebar-label">History</span>
      </a>
      <a href="/qrcode" class="sidebar-link">
        <span class="sidebar-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="6" height="6"/><rect x="15" y="3" width="6" height="6"/><rect x="3" y="15" width="6" height="6"/><path d="M21 15h-6v6"/></svg>
        </span>
        <span class="sidebar-label">QR Code</span>
      </a>
    </nav>
    <div class="sidebar-footer">
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content">

    <header class="topbar">
      <div class="topbar-left">
        <h1 class="topbar-title">Edit Booking</h1>
      </div>
      <div class="topbar-right">
        <button id="darkModeToggle" onclick="toggleDarkMode()" class="btn btn-ghost btn-icon" title="Toggle dark mode">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <a href="/qrcode?scan=1" class="btn btn-ghost btn-sm" title="Scan QR">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="6" height="6"/><rect x="15" y="3" width="6" height="6"/><rect x="3" y="15" width="6" height="6"/><path d="M21 15h-6v6"/></svg>
          Scan
        </a>
        <div class="topbar-clock">
          <div class="topbar-date" id="liveDate"></div>
          <div class="topbar-time" id="liveTime"></div>
        </div>
        <form action="/logout" method="post" style="display:inline;">
          <input type="hidden" name="_csrf" th:value="${_csrf.token}">
          <button type="submit" class="btn btn-ghost btn-sm btn-danger-ghost">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            Logout
          </button>
        </form>
      </div>
    </header>

    <div class="content">
      <div class="card edit-card">
        <div class="card-header">
          <h2>Edit Parking Booking</h2>
        </div>
        <div class="card-body">
          <p class="text-sm text-muted mb-20">Update the details for this parking slot.</p>

          <form action="/update" method="post">
            <input type="hidden" name="_csrf" th:value="${_csrf.token}">
            <input type="hidden" name="id" th:value="${parking.id}">

            <div class="form-grid-edit">
              <div>
                <label class="form-label">Owner Name</label>
                <input type="text" name="ownerName" class="input" th:value="${parking.ownerName}" placeholder="Owner Name">
              </div>
              <div>
                <label class="form-label">Mobile Number</label>
                <input type="text" name="mobileNumber" class="input" th:value="${parking.mobileNumber}" placeholder="Mobile Number" pattern="[0-9]{10}" maxlength="10" oninput="this.value=this.value.replace(/[^0-9]/g,'')" required>
              </div>
              <div class="full-width">
                <label class="form-label">Vehicle Number</label>
                <input type="text" name="vehicleNumber" class="input mono" th:value="${parking.vehicleNumber}" placeholder="Vehicle Number" oninput="var v=this.value.toUpperCase().replace(/[^A-Z0-9]/g,'');var r='';if(v.length>0)r+=v.slice(0,2);if(v.length>2)r+=' '+v.slice(2,4);if(v.length>4)r+=' '+v.slice(4,Math.min(6,v.length));if(v.length>6)r+=' '+v.slice(6,10);this.value=r;">
              </div>
              <div>
                <label class="form-label">Vehicle Type</label>
                <input type="text" name="vehicleType" class="input" th:value="${parking.vehicleType}" placeholder="Vehicle Type">
              </div>
              <div>
                <label class="form-label">Slot Number</label>
                <input type="text" id="slotDisplay" class="input mono input-readonly" th:value="${parking.slotNumber}" readonly>
                <input type="hidden" name="slotNumber" id="slotHidden" th:value="${parking.slotNumber}">
              </div>
              <div class="full-width" style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
                <div>
                  <label class="form-label">Change Basement</label>
                  <select id="editBasement" class="input" onchange="editUpdateSlots()">
                    <option value="">Select Basement</option>
                    <option value="B1">Basement B1</option>
                    <option value="B2">Basement B2</option>
                    <option value="B3">Basement B3</option>
                    <option value="B4">Basement B4</option>
                  </select>
                </div>
                <div>
                  <label class="form-label">Change Slot</label>
                  <select id="editSlot" class="input" disabled>
                    <option value="">First select basement</option>
                  </select>
                </div>
              </div>
            </div>

            <div class="flex gap-12 mt-20">
              <button type="submit" class="btn btn-primary btn-lg" style="flex:1;">Update Booking</button>
              <a href="/dashboard" class="btn btn-secondary btn-lg" style="flex:1;text-align:center;">Cancel</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
  function editUpdateSlots() {
    var b = document.getElementById("editBasement").value;
    var s = document.getElementById("editSlot");
    s.innerHTML = '<option value="">Select Slot Number</option>';
    s.disabled = !b;
    if (b) {
      for (var i = 1; i <= 120; i++) {
        var n = i.toString().padStart(3, '0');
        s.innerHTML += '<option value="' + b + '-' + n + '">' + b + ' - Slot ' + n + '</option>';
      }
    }
    s.onchange = function () {
      document.getElementById("slotHidden").value = this.value;
      document.getElementById("slotDisplay").value = this.value;
    };
    s.onchange();
  }

  window.onload = function () {
    var h = document.getElementById("slotHidden");
    var existing = h.value;
    if (existing && existing.indexOf('-') > 0) {
      var sep = existing.lastIndexOf('-');
      var basement = existing.substring(0, sep);
      document.getElementById("editBasement").value = basement;
      editUpdateSlots();
      document.getElementById("editSlot").value = existing;
      document.getElementById("slotHidden").value = existing;
      document.getElementById("slotDisplay").value = existing;
    }
  };
</script>

<script src="/js/app.js"></script>

</body>
</html>
