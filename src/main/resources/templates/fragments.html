<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

<div th:fragment="darkModeScript">
    <script>
        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            var isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('sppn-dark-mode', isDark ? 'true' : 'false');
            var btn = document.getElementById('darkModeToggle');
            if (btn) btn.textContent = isDark ? '\u2600\uFE0F' : '\uD83C\uDF19';
        }
        function applyDarkMode() {
            var isDark = localStorage.getItem('sppn-dark-mode') === 'true';
            if (isDark) {
                document.body.classList.add('dark-mode');
                var btn = document.getElementById('darkModeToggle');
                if (btn) btn.textContent = '\u2600\uFE0F';
            }
        }
        applyDarkMode();
    </script>
</div>

<div th:fragment="liveClockScript">
    <script>
        function updateClock() {
            var now = new Date();
            var days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
            var months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
            var dateEl = document.getElementById('liveDate');
            var timeEl = document.getElementById('liveTime');
            if (dateEl) dateEl.textContent = days[now.getDay()] + ', ' + now.getDate() + ' ' + months[now.getMonth()] + ' ' + now.getFullYear();
            if (timeEl) timeEl.textContent = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0') + ':' + now.getSeconds().toString().padStart(2,'0');
        }
        updateClock();
        setInterval(updateClock, 1000);
    </script>
</div>

</body>
</html>
